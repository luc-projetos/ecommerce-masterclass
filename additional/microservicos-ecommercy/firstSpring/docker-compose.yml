services:
  postgres:
    container_name: postgres_container
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 789789
      PGDATA: postgres_data:/data/postgres
    volumes:
      - postgres_data:/var/lib/postgres
    ports:
      - "5432:5432"
    networks:
      - postgres
    restart: always
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_web
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: luc.oliveira343@gmail.com
      PGADMIN_DEFAULT_PASSWORD: 534680Lu*
    ports:
      - "5050:80"
    networks:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

networks:
  postgres:
    driver: bridge
volumes:
  postgres_data:
  pgadmin_data:
